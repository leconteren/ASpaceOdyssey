# ── 设置 ─────────────────────────────────────────────────────
settings:
  output_dir: output
  # 追踪业绩后股价反应的时间窗口（交易日）
  price_tracking_windows: [1, 5, 20]
  # 市场情绪阈值
  sentiment:
    bullish: 0.7    # beat且涨的比例 > 70% → 情绪偏多
    neutral_low: 0.4
    neutral_high: 0.7
    bearish: 0.4    # < 40% → 情绪偏空
  # AI 关键词（用于从earnings call中提取AI相关信息）
  ai_keywords:
    - artificial intelligence
    - AI
    - machine learning
    - deep learning
    - generative AI
    - GenAI
    - large language model
    - LLM
    - GPU
    - accelerator
    - inference
    - training
    - data center
    - cloud AI
    - copilot
    - agent
    - agentic
    - RAG
    - transformer
    - neural network
    - AI capex
    - AI revenue
    - AI monetization
