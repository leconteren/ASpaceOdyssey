
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投研中台 - Research Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --reddit-orange: #ff4500;
            --reddit-blue: #0079d3;
            --reddit-lightblue: #24a0ed;
            --bg-primary: #dae0e6;
            --bg-secondary: #ffffff;
            --text-primary: #1c1c1c;
            --text-secondary: #7c7c7c;
            --border-color: #ccc;
        }
        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
        }
        .reddit-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        .reddit-card:hover {
            border-color: #898989;
        }
        .vote-column {
            background: #f8f9fa;
            border-right: 1px solid #edeff1;
        }
        .reddit-btn {
            background: var(--reddit-blue);
            color: white;
            border-radius: 9999px;
            padding: 8px 16px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .reddit-btn:hover {
            background: #006cbd;
        }
        .reddit-btn-outline {
            background: transparent;
            color: var(--reddit-blue);
            border: 1px solid var(--reddit-blue);
            border-radius: 9999px;
            padding: 8px 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .reddit-btn-outline:hover {
            background: rgba(0, 121, 211, 0.1);
        }
        .upvote:hover { color: var(--reddit-orange); }
        .downvote:hover { color: var(--reddit-blue); }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s;
        }
        .sidebar-link:hover {
            background: #e8e8e8;
        }
        .sidebar-link.active {
            background: #e8e8e8;
            font-weight: 600;
            border-left: 3px solid var(--reddit-orange);
        }
        .header-search {
            background: #f6f7f8;
            border: 1px solid #edeff1;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .header-search:hover, .header-search:focus-within {
            background: white;
            border-color: var(--reddit-blue);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
