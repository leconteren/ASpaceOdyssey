name: Track Claude Code Commits

on:
  # Run weekly on Monday at 9:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      since:
        description: 'Only count commits after this date (YYYY-MM-DD)'
        required: false
      branch:
        description: 'Branch to analyze (leave empty for all)'
        required: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for accurate counting

      - name: Count Claude Code commits
        id: count
        run: |
          ARGS=()
          if [[ -n "${{ github.event.inputs.since }}" ]]; then
            ARGS+=(--since "${{ github.event.inputs.since }}")
          fi
          if [[ -n "${{ github.event.inputs.branch }}" ]]; then
            ARGS+=(--branch "${{ github.event.inputs.branch }}")
          fi

          # Get totals using the script
          JSON=$(bash scripts/track-claude-commits.sh "${ARGS[@]}" --json)

          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$JSON" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          TOTAL=$(echo "$JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['total_commits'])")
          CLAUDE=$(echo "$JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['claude_commits'])")
          PCT=$(echo "$JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['claude_percentage'])")

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "claude=$CLAUDE" >> "$GITHUB_OUTPUT"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - name: Print summary
        run: |
          bash scripts/track-claude-commits.sh

      - name: Create/update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const stats = JSON.parse(`${{ steps.count.outputs.json }}`);
            const now = new Date().toISOString().split('T')[0];

            const title = '📊 Claude Code Commit Tracking';
            const body = [
              `## Claude Code Contribution Report`,
              `_Updated: ${now}_`,
              ``,
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Total commits | ${stats.total_commits} |`,
              `| Claude Code commits | ${stats.claude_commits} |`,
              `| Human commits | ${stats.human_commits} |`,
              `| Claude Code % | ${stats.claude_percentage}% |`,
              ``,
              `### By Month`,
              `| Month | Total | Claude | Human | Claude % |`,
              `|-------|-------|--------|-------|----------|`,
              ...Object.entries(stats.by_month || {}).sort().map(([m, d]) =>
                `| ${m} | ${d.total} | ${d.claude} | ${d.total - d.claude} | ${d.total ? ((d.claude/d.total)*100).toFixed(0) : 0}% |`
              ),
              ``,
              `### By Author`,
              `| Author | Total | Claude | Human |`,
              `|--------|-------|--------|-------|`,
              ...Object.entries(stats.by_author || {}).map(([a, d]) =>
                `| ${a} | ${d.total} | ${d.claude} | ${d.total - d.claude} |`
              ),
              ``,
              `---`,
              `_Generated by [track-claude-commits workflow](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})_`
            ].join('\n');

            // Find existing tracking issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'claude-tracking',
            });

            const existing = issues.data.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              // Create label if missing
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'claude-tracking',
                  color: 'D4A373',
                  description: 'Automated Claude Code contribution tracking',
                });
              } catch (e) {
                // Label may already exist
              }

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['claude-tracking'],
              });
              console.log(`Created issue #${issue.data.number}`);
            }
