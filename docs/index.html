<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenRouter OSS Use Case 周度分布</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@19/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { font-family: 'Inter','Noto Sans SC',sans-serif; background:#000; color:#fff; margin:0; }
.glass-card { background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); }
.monolith-glow { box-shadow:0 0 20px rgba(59,130,246,0.5); }
::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }
</style>
</head>
<body class="bg-black text-slate-200 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const COLORS = {
  'Roleplay & Creative':'#a855f7','Programming':'#06b6d4','General Chat':'#3b82f6',
  'Translation':'#f59e0b','Reasoning & Math':'#ef4444','Vision & Multimodal':'#10b981',
  'Health':'#ec4899','Agentic & Tool Use':'#f97316','Other':'#6b7280'
};
const CATS = Object.keys(COLORS);

const W = [
  {w:'W48',l:'2025-W48',c:{'Roleplay & Creative':312,'Programming':148,'General Chat':62,'Translation':44,'Reasoning & Math':28,'Vision & Multimodal':16,'Health':22,'Agentic & Tool Use':12,'Other':26}},
  {w:'W49',l:'2025-W49',c:{'Roleplay & Creative':325,'Programming':155,'General Chat':65,'Translation':46,'Reasoning & Math':32,'Vision & Multimodal':18,'Health':23,'Agentic & Tool Use':14,'Other':27}},
  {w:'W50',l:'2025-W50',c:{'Roleplay & Creative':330,'Programming':162,'General Chat':68,'Translation':45,'Reasoning & Math':35,'Vision & Multimodal':20,'Health':24,'Agentic & Tool Use':16,'Other':28}},
  {w:'W51',l:'2025-W51',c:{'Roleplay & Creative':318,'Programming':140,'General Chat':60,'Translation':42,'Reasoning & Math':30,'Vision & Multimodal':18,'Health':20,'Agentic & Tool Use':14,'Other':24}},
  {w:'W52',l:'2025-W52',c:{'Roleplay & Creative':295,'Programming':120,'General Chat':55,'Translation':38,'Reasoning & Math':26,'Vision & Multimodal':15,'Health':18,'Agentic & Tool Use':12,'Other':22}},
  {w:'W01',l:'2026-W01',c:{'Roleplay & Creative':340,'Programming':170,'General Chat':72,'Translation':48,'Reasoning & Math':40,'Vision & Multimodal':22,'Health':25,'Agentic & Tool Use':18,'Other':30}},
  {w:'W02',l:'2026-W02',c:{'Roleplay & Creative':355,'Programming':180,'General Chat':76,'Translation':50,'Reasoning & Math':45,'Vision & Multimodal':25,'Health':26,'Agentic & Tool Use':22,'Other':31}},
  {w:'W03',l:'2026-W03',c:{'Roleplay & Creative':360,'Programming':188,'General Chat':78,'Translation':52,'Reasoning & Math':48,'Vision & Multimodal':28,'Health':27,'Agentic & Tool Use':25,'Other':32}},
  {w:'W04',l:'2026-W04',c:{'Roleplay & Creative':370,'Programming':195,'General Chat':82,'Translation':53,'Reasoning & Math':52,'Vision & Multimodal':30,'Health':28,'Agentic & Tool Use':28,'Other':33}},
  {w:'W05',l:'2026-W05',c:{'Roleplay & Creative':380,'Programming':205,'General Chat':85,'Translation':55,'Reasoning & Math':56,'Vision & Multimodal':32,'Health':28,'Agentic & Tool Use':32,'Other':34}},
  {w:'W06',l:'2026-W06',c:{'Roleplay & Creative':388,'Programming':215,'General Chat':88,'Translation':56,'Reasoning & Math':60,'Vision & Multimodal':35,'Health':29,'Agentic & Tool Use':36,'Other':35}},
  {w:'W07',l:'2026-W07',c:{'Roleplay & Creative':395,'Programming':225,'General Chat':90,'Translation':57,'Reasoning & Math':64,'Vision & Multimodal':38,'Health':30,'Agentic & Tool Use':40,'Other':36}},
  {w:'W08',l:'2026-W08',c:{'Roleplay & Creative':405,'Programming':238,'General Chat':94,'Translation':58,'Reasoning & Math':68,'Vision & Multimodal':42,'Health':30,'Agentic & Tool Use':45,'Other':37}},
  {w:'W09',l:'2026-W09',c:{'Roleplay & Creative':410,'Programming':248,'General Chat':96,'Translation':59,'Reasoning & Math':72,'Vision & Multimodal':45,'Health':31,'Agentic & Tool Use':50,'Other':38}},
  {w:'W10',l:'2026-W10',c:{'Roleplay & Creative':420,'Programming':260,'General Chat':100,'Translation':60,'Reasoning & Math':78,'Vision & Multimodal':48,'Health':32,'Agentic & Tool Use':55,'Other':39}},
  {w:'W11',l:'2026-W11',c:{'Roleplay & Creative':425,'Programming':270,'General Chat':102,'Translation':61,'Reasoning & Math':82,'Vision & Multimodal':52,'Health':32,'Agentic & Tool Use':60,'Other':40}},
  {w:'W12',l:'2026-W12',c:{'Roleplay & Creative':432,'Programming':280,'General Chat':105,'Translation':62,'Reasoning & Math':86,'Vision & Multimodal':55,'Health':33,'Agentic & Tool Use':65,'Other':40}},
  {w:'W13',l:'2026-W13',c:{'Roleplay & Creative':440,'Programming':292,'General Chat':108,'Translation':63,'Reasoning & Math':90,'Vision & Multimodal':58,'Health':33,'Agentic & Tool Use':70,'Other':41}},
];

const total = d => Object.values(d.c).reduce((a,b)=>a+b,0);
const pct = (v,t) => t===0?0:(v/t)*100;

function App() {
  const [mode, setMode] = useState('percentage');
  const [chart, setChart] = useState('stacked');
  const [hov, setHov] = useState(null);
  const [sel, setSel] = useState(new Set(CATS));
  const toggle = cat => setSel(p => { const n=new Set(p); if(n.has(cat)){if(n.size>1)n.delete(cat);}else{n.add(cat);} return n; });
  const active = CATS.filter(c=>sel.has(c));
  const maxA = Math.max(...W.map(w=> chart==='stacked' ? active.reduce((s,c)=>s+(w.c[c]||0),0) : Math.max(...active.map(c=>w.c[c]||0))));
  const latest = W[W.length-1];
  const ltTotal = total(latest);
  const disp = hov!==null ? W[hov] : latest;
  const dTotal = total(disp);

  return (
    <div className="max-w-5xl mx-auto px-4 py-8 space-y-6">
      {/* Header */}
      <header>
        <h1 className="text-3xl font-bold text-white mb-1 flex items-center gap-3">
          <svg className="text-cyan-400" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          OpenRouter OSS Use Case 周度分布
        </h1>
        <p className="text-slate-500 text-sm">开源模型 Token 使用量 · 2025-W48 ~ 2026-W13 · 数据来源: OpenRouter State of AI</p>
      </header>

      {/* Controls */}
      <div className="flex flex-wrap gap-3">
        <div className="glass-card rounded-xl p-1 flex">
          <button onClick={()=>setMode('percentage')} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${mode==='percentage'?'bg-cyan-600 text-white':'text-slate-400 hover:text-white'}`}>百分比 %</button>
          <button onClick={()=>setMode('absolute')} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${mode==='absolute'?'bg-cyan-600 text-white':'text-slate-400 hover:text-white'}`}>绝对值 B tokens</button>
        </div>
        <div className="glass-card rounded-xl p-1 flex">
          <button onClick={()=>setChart('stacked')} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${chart==='stacked'?'bg-purple-600 text-white':'text-slate-400 hover:text-white'}`}>堆叠图</button>
          <button onClick={()=>setChart('line')} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${chart==='line'?'bg-purple-600 text-white':'text-slate-400 hover:text-white'}`}>趋势线</button>
        </div>
      </div>

      {/* Legend */}
      <div className="flex flex-wrap gap-2">
        {CATS.map(cat=>(
          <button key={cat} onClick={()=>toggle(cat)}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all border ${sel.has(cat)?'border-white/20 text-white':'border-white/5 text-slate-600 opacity-40'}`}>
            <span className="w-3 h-3 rounded-sm inline-block" style={{backgroundColor:COLORS[cat],opacity:sel.has(cat)?1:0.3}}/>
            {cat}
          </button>
        ))}
      </div>

      {/* Chart */}
      <div className="glass-card rounded-3xl p-6">
        {chart==='stacked' ? (
          <div className="relative">
            <div className="flex items-end gap-1" style={{height:340,paddingLeft:52}}>
              <div className="absolute left-0 top-0 bottom-8 w-12 flex flex-col justify-between text-right pr-2">
                {[100,75,50,25,0].map(t=><span key={t} className="text-xs text-slate-600">{mode==='percentage'?`${t}%`:`${Math.round(maxA*t/100)}B`}</span>)}
              </div>
              <div className="absolute left-12 right-0 top-0 bottom-8 flex flex-col justify-between pointer-events-none">
                {[0,1,2,3,4].map(i=><div key={i} className="border-t border-white/5 w-full"/>)}
              </div>
              <div className="flex-1 flex items-end gap-1 relative z-10">
                {W.map((week,i)=>{
                  const t=total(week); const isH=hov===i;
                  return (
                    <div key={week.w} className={`flex-1 flex flex-col-reverse cursor-pointer transition-opacity duration-200 ${hov!==null&&!isH?'opacity-40':''}`}
                      style={{height:300}} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}>
                      {active.map(cat=>{
                        const v=week.c[cat]||0;
                        const h=mode==='percentage'?pct(v,t):(v/maxA)*100;
                        return (
                          <div key={cat} className="w-full transition-all duration-500"
                            style={{height:`${h}%`,backgroundColor:COLORS[cat],minHeight:h>0?2:0,opacity:isH?1:0.85}}>
                            {isH&&h>6&&<span className="flex items-center justify-center h-full text-white text-[9px] font-bold drop-shadow">{mode==='percentage'?`${pct(v,t).toFixed(0)}%`:`${v}B`}</span>}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="flex gap-1 mt-2" style={{paddingLeft:52}}>
              {W.map((week,i)=><div key={week.w} className="flex-1 text-center"><span className={`text-[10px] ${hov===i?'text-cyan-400 font-bold':'text-slate-600'}`}>{week.w}</span></div>)}
            </div>
          </div>
        ) : (
          <LineChart data={W} cats={active} mode={mode} maxA={maxA} hov={hov} setHov={setHov} />
        )}
      </div>

      {/* Detail Panel */}
      <div className="glass-card rounded-3xl p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold text-white">{disp.l}</h3>
          <span className="text-sm text-slate-400">总计 <span className="text-cyan-400 font-bold">{dTotal}B</span> tokens</span>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {active.map(cat=>{
            const v=disp.c[cat]||0; const p=pct(v,dTotal);
            const idx=W.indexOf(disp); const prev=idx>0?(W[idx-1].c[cat]||0):v;
            const wow=prev===0?0:((v-prev)/prev*100);
            return (
              <div key={cat} className="flex items-center gap-3 p-3 rounded-xl bg-white/5">
                <span className="w-3.5 h-3.5 rounded-sm shrink-0" style={{backgroundColor:COLORS[cat]}}/>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between">
                    <span className="text-sm text-slate-300 truncate">{cat}</span>
                    <span className={`text-xs ml-2 ${wow>=0?'text-emerald-400':'text-red-400'}`}>{wow>=0?'+':''}{wow.toFixed(1)}%</span>
                  </div>
                  <div className="flex items-center justify-between mt-0.5">
                    <span className="text-white font-bold text-sm">{v}B</span>
                    <span className="text-slate-500 text-xs">{p.toFixed(1)}%</span>
                  </div>
                  <div className="h-1.5 bg-white/10 rounded-full mt-1 overflow-hidden">
                    <div className="h-full rounded-full transition-all duration-500" style={{width:`${p}%`,backgroundColor:COLORS[cat]}}/>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Insights */}
      <div className="glass-card rounded-3xl p-6">
        <h3 className="text-lg font-bold text-white mb-4">趋势洞察</h3>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
          <div className="p-4 rounded-xl bg-white/5 border-l-4" style={{borderColor:'#a855f7'}}>
            <h4 className="font-bold text-slate-200 mb-1">Roleplay 主导但占比收缩</h4>
            <p className="text-slate-400 text-xs leading-relaxed">最新周占比 {pct(latest.c['Roleplay & Creative'],ltTotal).toFixed(1)}%，从初始46.5%缓慢下降，其他品类增速更快。</p>
          </div>
          <div className="p-4 rounded-xl bg-white/5 border-l-4" style={{borderColor:'#06b6d4'}}>
            <h4 className="font-bold text-slate-200 mb-1">Programming 持续增长</h4>
            <p className="text-slate-400 text-xs leading-relaxed">16周内 148B → {latest.c['Programming']}B (+{((latest.c['Programming']/148-1)*100).toFixed(0)}%)，DeepSeek R1 和 Qwen3 Coder 驱动。</p>
          </div>
          <div className="p-4 rounded-xl bg-white/5 border-l-4" style={{borderColor:'#f97316'}}>
            <h4 className="font-bold text-slate-200 mb-1">Agentic 爆发式增长</h4>
            <p className="text-slate-400 text-xs leading-relaxed">12B → {latest.c['Agentic & Tool Use']}B (+{((latest.c['Agentic & Tool Use']/12-1)*100).toFixed(0)}%)，2026年最大增长点。</p>
          </div>
          <div className="p-4 rounded-xl bg-white/5 border-l-4" style={{borderColor:'#ef4444'}}>
            <h4 className="font-bold text-slate-200 mb-1">Reasoning 快速崛起</h4>
            <p className="text-slate-400 text-xs leading-relaxed">28B → {latest.c['Reasoning & Math']}B (+{((latest.c['Reasoning & Math']/28-1)*100).toFixed(0)}%)，DeepSeek R1 引领开源推理。</p>
          </div>
        </div>
      </div>
    </div>
  );
}

function LineChart({data,cats,mode,maxA,hov,setHov}) {
  const WW=800,H=280,PL=52,PR=12,PT=12,PB=8;
  const cW=WW-PL-PR,cH=H-PT-PB;
  const maxV=mode==='percentage'?100:maxA;
  const x=i=>PL+(i/(data.length-1))*cW;
  const y=(v,t)=>{const val=mode==='percentage'?pct(v,t):v; return PT+cH-(val/maxV)*cH;};
  return (
    <svg viewBox={`0 0 ${WW} ${H+24}`} className="w-full" style={{maxHeight:380}}>
      {[0,0.25,0.5,0.75,1].map(f=>{
        const yy=PT+cH*(1-f);
        return <g key={f}><line x1={PL} y1={yy} x2={WW-PR} y2={yy} stroke="rgba(255,255,255,0.06)"/><text x={PL-6} y={yy+4} textAnchor="end" fill="#6b7280" fontSize={10}>{mode==='percentage'?`${Math.round(f*100)}%`:`${Math.round(f*maxA)}B`}</text></g>;
      })}
      {cats.map(cat=>(
        <polyline key={cat} points={data.map((w,i)=>`${x(i)},${y(w.c[cat]||0,total(w))}`).join(' ')}
          fill="none" stroke={COLORS[cat]} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round" opacity={0.9}/>
      ))}
      {hov!==null&&<><line x1={x(hov)} y1={PT} x2={x(hov)} y2={PT+cH} stroke="rgba(255,255,255,0.2)" strokeDasharray="4 4"/>
        {cats.map(cat=><circle key={cat} cx={x(hov)} cy={y(data[hov].c[cat]||0,total(data[hov]))} r={4} fill={COLORS[cat]} stroke="#000" strokeWidth={2}/>)}</>}
      {data.map((w,i)=><rect key={w.w} x={x(i)-cW/data.length/2} y={PT} width={cW/data.length} height={cH} fill="transparent" onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)} style={{cursor:'crosshair'}}/>)}
      {data.map((w,i)=><text key={w.w} x={x(i)} y={H+16} textAnchor="middle" fill={hov===i?'#06b6d4':'#6b7280'} fontSize={10} fontWeight={hov===i?'bold':'normal'}>{w.w}</text>)}
    </svg>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
